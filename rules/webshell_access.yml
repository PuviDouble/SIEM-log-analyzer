title: Web Shell Interaction Detected
id: e44190fa-1234-4567-89ab-cdef01234567
status: production
description: Detects requests targeting common web shell scripts or command execution query string parameters.
author: SIEM Sentinel Team
date: 2026-10-05
references:
    - https://attack.mitre.org/techniques/T1505/003/
tags:
    - attack.persistence
    - attack.t1505.003
logsource:
    category: webserver
    product: generic
detection:
    selection:
        url|contains:
            - "c99.php"
            - "r57.php"
            - "b374k.php"
            - "cmd.php"
            - "shell.php"
            - "passthru"
            - "eval("
            - "system("
    condition: selection
level: critical
